[project]
name = "agentevalgate"
version = "0.1.0"
description = "Merge-blocking CI evaluation gate for RAG applications"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# No unconditional base dependencies: API, eval harness, and dashboard are three
# separately-deployed components (Day 4 / Step 4) with genuinely non-overlapping
# needs - the dashboard, in particular, needs none of this. See
# internal/mentoring_notes.md (Day 4 / Step 4) for why this changed today.
api = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "pydantic-settings==2.14.2",
    "numpy==2.5.1",
    "openai==2.48.0",
    "slowapi==0.1.10",
]
dev = [
    "pytest==9.1.1",
]
eval = [
    "ragas==0.4.3",
    "deepeval==4.1.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai unconditionally, but
    # langchain-community's newest version satisfying ragas's own constraint (0.4.2) already
    # dropped that submodule during its provider-package split - pinned explicitly to the
    # newest version confirmed to still have it, otherwise `import ragas` fails outright.
    "langchain-community==0.3.27",
]
dashboard = [
    "streamlit==1.60.0",
    "pandas==3.0.5",
]
# The 3 packages the dashboard's "Try It Live" tab needs beyond the base `dashboard`
# extra - deliberately its own group rather than reusing `api` wholesale, which would
# drag in fastapi/uvicorn/slowapi (dead weight for a Streamlit process, the exact bloat
# Day 4 / Step 4 split `dashboard` out to avoid). Pins hand-duplicated from `api` - see
# internal/mentoring_notes.md, Day 8 / Step 3. `ragas`/`deepeval`/`langchain-community`
# also needed for score_example() come from the existing `eval` extra, installed
# alongside this one, not folded in here.
dashboard-live = [
    "numpy==2.5.1",
    "openai==2.48.0",
    "pydantic-settings==2.14.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
